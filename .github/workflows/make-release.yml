name: Make release

on:
  workflow_dispatch: # allows manual triggering

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  PYTHONWARNINGS: ignore

jobs:
  create-tag:
    runs-on: ubuntu-22.04

    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      name: ${{ steps.tag.outputs.name }}

    steps:
    - name: Clone
      id: checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine tag name
      id: tag
      shell: bash
      run: |
        BUILD_NUMBER="$(git rev-list --count HEAD)"
        SHORT_HASH="$(git rev-parse --short=7 HEAD)"
        if [[ "${{ env.BRANCH_NAME }}" == "master-custom" ]]; then
          echo "name=b${BUILD_NUMBER}" >> $GITHUB_OUTPUT
        else
          SAFE_NAME=$(echo "${{ env.BRANCH_NAME }}" | tr '/' '-')
          echo "name=${SAFE_NAME}-b${BUILD_NUMBER}-${SHORT_HASH}" >> $GITHUB_OUTPUT
        fi

    - name: Create release
      id: create_release
      uses: anzz1/action-create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        draft: true
        tag_name: ${{ steps.tag.outputs.name }}

  build-release:
    needs:
    - create-tag
    runs-on: windows-latest
    env:
      BACKEND: cuda
      BUILD_NAME: ${{ needs.create-tag.outputs.name }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: |
          server/requirements-common.txt
          server/requirements-cuda-5080.txt

    - name: Installing build dependencies
      run: python -m pip install --no-cache-dir --upgrade pip wheel setuptools pyinstaller

    - name: Installing project dependencies (RTX 5080 Optimized)
      run: python -m pip install --no-cache-dir -r requirements-common.txt -r requirements-cuda-5080.txt
      working-directory: ./server

    - name: Building executable (RTX 5080 Spec)
      run: pyinstaller --clean -y --dist ./dist --workpath /tmp MMVCServerSIO.spec
      working-directory: ./server

    - name: Copy utils
      run: cp ./server/{force_gpu_clocks.bat,reset_gpu_clocks.bat} ./server/dist/
      shell: bash

    - name: Pack artifact
      shell: bash
      run: |
        mkdir ./server/artifacts
        7z a -mx=5 -v2000m ./server/artifacts/voice-changer-windows-amd64-cuda-5080.7z ./server/dist/* > /dev/null 2>&1

    - name: Rename single asset
      shell: bash
      run: |
        ls -al ./server/artifacts/
        COUNT=$(ls -1q ./server/artifacts/ | wc -l | sed -r 's/[[:space:]]+//g')
        if [ $COUNT = 1 ]; then
          mv ./server/artifacts/voice-changer-windows-amd64-cuda-5080.7z.001 ./server/artifacts/voice-changer-windows-amd64-cuda-5080.7z
        fi

    - name: Upload release
      id: upload_release
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const path = require('path');
          const fs = require('fs');
          const root = './server/artifacts';
          const release_id = '${{ needs.create-tag.outputs.release_id }}';
          const files = fs.readdirSync(root);
          for (const file of files) {
            console.log('uploadReleaseAsset', file);
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release_id,
              name: file,
              data: await fs.readFileSync(path.join(root, file))
            });
          }
