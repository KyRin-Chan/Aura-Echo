name: Make release

on:
  workflow_dispatch: # allows manual triggering

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  PYTHONWARNINGS: ignore

jobs:
  create-tag:
    runs-on: ubuntu-22.04

    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      name: ${{ steps.tag.outputs.name }}

    steps:
    - name: Clone
      id: checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine tag name
      id: tag
      shell: bash
      run: |
        BUILD_NUMBER="$(git rev-list --count HEAD)"
        SHORT_HASH="$(git rev-parse --short=7 HEAD)"
        if [[ "${{ env.BRANCH_NAME }}" == "master-custom" ]]; then
          echo "name=b${BUILD_NUMBER}" >> $GITHUB_OUTPUT
        else
          SAFE_NAME=$(echo "${{ env.BRANCH_NAME }}" | tr '/' '-')
          echo "name=${SAFE_NAME}-b${BUILD_NUMBER}-${SHORT_HASH}" >> $GITHUB_OUTPUT
        fi

    - name: Create release
      id: create_release
      uses: anzz1/action-create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        draft: true
        tag_name: ${{ steps.tag.outputs.name }}

  build-release:
    needs:
    - create-tag
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [patch, full]
    env:
      BACKEND: cuda
      BUILD_NAME: ${{ needs.create-tag.outputs.name }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          client/lib/package-lock.json
          client/modern-gui/package-lock.json

    - name: Install and Build Client Library
      working-directory: ./client/lib
      run: |
        npm ci --legacy-peer-deps
        npm run build:prod

    - name: Install and Build Modern GUI
      working-directory: ./client/modern-gui
      run: |
        npm ci --legacy-peer-deps
        xcopy "..\lib\dist\*" "node_modules\@dannadori\voice-changer-client-js\dist\" /S /E /Y /I
        npm run build:prod

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache Virtual Environment
      uses: actions/cache@v4
      id: cache-venv
      with:
        path: .venv
        key: venv-${{ runner.os }}-full-${{ hashFiles('server/requirements-common.txt', 'server/requirements-cuda-5080.txt') }}

    - name: Setup Virtual Environment
      if: steps.cache-venv.outputs.cache-hit != 'true'
      run: |
        python -m venv .venv
        .venv\Scripts\python -m pip install --upgrade pip wheel setuptools pyinstaller

    - name: Install Common Dependencies
      working-directory: ./server
      run: |
        ..\.venv\Scripts\python -m pip install -r requirements-common.txt

    - name: Install CUDA Dependencies (Full Build Only)
      working-directory: ./server
      run: |
        ..\.venv\Scripts\python -m pip install -r requirements-cuda-5080.txt

    - name: Building executable (RTX 5080 Spec)
      working-directory: ./server
      run: |
        ..\.venv\Scripts\python -m PyInstaller --clean -y --dist ./dist MMVCServerSIO.spec
      env:
        LIGHTWEIGHT_BUILD: false

    - name: Copy utils
      run: cp ./server/{force_gpu_clocks.bat,reset_gpu_clocks.bat} ./server/dist/
      shell: bash

    - name: Pack artifact
      shell: bash
      run: |
        mkdir ./server/artifacts
        ARCHIVE_NAME="voice-changer-windows-amd64-cuda-5080"
        EXTRA_7Z_ARGS=""
        VOLUME_ARG="-v2000m"
        if [ "${{ matrix.build_type }}" = "patch" ]; then
          ARCHIVE_NAME="${ARCHIVE_NAME}-patch"
          EXTRA_7Z_ARGS="-xr!torch -xr!torchaudio -xr!tensorrt -xr!onnxruntime -xr!onnx -xr!onnxscript -xr!onnxslim -xr!torchcrepe -xr!torchfcpe -xr!scipy -xr!faiss -xr!cublas*.dll -xr!cudnn*.dll -xr!cufft*.dll -xr!curand*.dll -xr!cusparse*.dll -xr!cusolver*.dll -xr!npp*.dll -xr!nvrtc*.dll -xr!libonnxruntime*.dll -xr!nvinfer*.dll -xr!tensorrt*.dll -xr!libnv*.dll"
          VOLUME_ARG=""
        fi
        echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV
        7z a $EXTRA_7Z_ARGS $VOLUME_ARG ./server/artifacts/${ARCHIVE_NAME}.7z ./server/dist/* > /dev/null 2>&1

    - name: Rename single asset
      shell: bash
      run: |
        ls -al ./server/artifacts/
        if [ -f "./server/artifacts/${{ env.ARCHIVE_NAME }}.7z.001" ] && [ ! -f "./server/artifacts/${{ env.ARCHIVE_NAME }}.7z.002" ]; then
          mv ./server/artifacts/${{ env.ARCHIVE_NAME }}.7z.001 ./server/artifacts/${{ env.ARCHIVE_NAME }}.7z
        fi

    - name: Upload release
      id: upload_release
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const path = require('path');
          const fs = require('fs');
          const root = './server/artifacts';
          const release_id = '${{ needs.create-tag.outputs.release_id }}';
          const files = fs.readdirSync(root);
          for (const file of files) {
            console.log('uploadReleaseAsset', file);
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release_id,
              name: file,
              data: await fs.readFileSync(path.join(root, file))
            });
          }
