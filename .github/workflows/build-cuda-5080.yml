name: Build RTX 5080 CUDA Optimized Executable

on:
  push:
    branches: [ master-custom ]
  pull_request:
    branches: [ master-custom ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (auto, lightweight, full)'
        required: true
        default: 'auto'
        type: choice
        options:
        - auto
        - lightweight
        - full

env:
  BACKEND: cuda
  BUILD_NAME: rtx5080-optimized
  PYTHONWARNINGS: ignore
  PYINSTALLER_CACHE_DIR: ${{ github.workspace }}/.pyinstaller_cache

jobs:
  build-win-cuda-5080:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine Build Type
      id: determine_build
      shell: bash
      run: |
        BUILD_TYPE="${{ inputs.build_type || 'auto' }}"
        
        if [ "$BUILD_TYPE" = "auto" ]; then
          BUILD_TYPE="lightweight"
          
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null || echo "ALL")
          else
            CHANGED_FILES="ALL"
          fi
          
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          if echo "$CHANGED_FILES" | grep -qE "requirements-cuda-5080\.txt|MMVCServerSIO\.spec|\.github/workflows/"; then
            echo "Build configuration or dependency file changed. Selecting FULL build."
            BUILD_TYPE="full"
          elif [ "$CHANGED_FILES" = "ALL" ]; then
            echo "Could not fetch diff. Selecting FULL build as fallback."
            BUILD_TYPE="full"
          else
            echo "Only logic files changed. Selecting LIGHTWEIGHT build."
          fi
        fi
        
        echo "Final Build Type: $BUILD_TYPE"
        echo "build_type=${BUILD_TYPE}" >> $GITHUB_OUTPUT

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache Virtual Environment
      uses: actions/cache@v4
      id: cache-venv
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.determine_build.outputs.build_type }}-${{ hashFiles('server/requirements-common.txt', 'server/requirements-cuda-5080.txt') }}

    - name: Cache PyInstaller Build Cache
      uses: actions/cache@v4
      with:
        path: server/build
        key: pyinstaller-build-${{ runner.os }}-${{ steps.determine_build.outputs.build_type }}-${{ github.sha }}
        restore-keys: |
          pyinstaller-build-${{ runner.os }}-${{ steps.determine_build.outputs.build_type }}-

    - name: Setup Virtual Environment
      if: steps.cache-venv.outputs.cache-hit != 'true'
      run: |
        python -m venv .venv
        .venv\Scripts\python -m pip install --upgrade pip wheel setuptools pyinstaller

    - name: Install Common Dependencies
      if: steps.cache-venv.outputs.cache-hit != 'true'
      working-directory: ./server
      run: |
        ..\.venv\Scripts\python -m pip install -r requirements-common.txt

    - name: Install CUDA Dependencies (Full Build Only)
      if: steps.cache-venv.outputs.cache-hit != 'true' && steps.determine_build.outputs.build_type == 'full'
      working-directory: ./server
      run: |
        ..\.venv\Scripts\python -m pip install -r requirements-cuda-5080.txt

    - name: Cache PyInstaller Directory
      uses: actions/cache@v4
      with:
        path: .pyinstaller_cache
        key: pyinstaller-cache-${{ runner.os }}-${{ hashFiles('server/requirements-common.txt', 'server/requirements-cuda-5080.txt') }}

    - name: Create PyInstaller Cache Directory
      run: mkdir -p .pyinstaller_cache
      shell: bash

    - name: Building executable (RTX 5080 Spec)
      working-directory: ./server
      run: |
        ..\.venv\Scripts\python -m PyInstaller -y --dist ./dist MMVCServerSIO.spec
      env:
        LIGHTWEIGHT_BUILD: ${{ steps.determine_build.outputs.build_type == 'lightweight' }}

    - name: Copy utils
      run: cp ./server/{force_gpu_clocks.bat,reset_gpu_clocks.bat} ./server/dist/
      shell: bash

    - name: Pack artifact
      shell: bash
      run: |
        mkdir ./server/artifacts
        ARCHIVE_NAME="voice-changer-windows-amd64-cuda-5080"
        if [ "${{ steps.determine_build.outputs.build_type }}" = "lightweight" ]; then
          ARCHIVE_NAME="${ARCHIVE_NAME}-lightweight"
        fi
        echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV
        7z a -v2000m ./server/artifacts/${ARCHIVE_NAME}.7z ./server/dist/* > /dev/null 2>&1

    - name: Rename single asset
      shell: bash
      run: |
        ls -al ./server/artifacts/
        COUNT=$(ls -1q ./server/artifacts/ | wc -l | sed -r 's/[[:space:]]+//g')
        if [ $COUNT = 1 ]; then
          mv ./server/artifacts/${{ env.ARCHIVE_NAME }}.7z.001 ./server/artifacts/${{ env.ARCHIVE_NAME }}.7z
        fi

    - name: Uploading artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARCHIVE_NAME }}
        path: ./server/artifacts
